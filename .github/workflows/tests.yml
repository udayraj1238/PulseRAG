name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Unit + integration tests need no secrets and no external network -
      # these run on every push and every PR, always.
      - name: Run unit and integration tests
        run: pytest tests/unit/ tests/integration/ -v

  adversarial-and-e2e:
    runs-on: ubuntu-latest
    needs: unit-and-integration
    # Only runs if GROQ_API_KEY is actually configured as a repo secret.
    # If it's missing, this job is skipped entirely rather than failing -
    # the tests themselves also skip individually via pytest.skip(),
    # so this is a second layer of the same honest fail-safe behavior.
    if: ${{ vars.HAS_GROQ_API_KEY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run adversarial and e2e tests (real LLM calls)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest tests/e2e/ -v
